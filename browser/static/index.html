<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casting Dataset Browser</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Casting Dataset</p>
        <h1>Casting Dataset Models</h1>
      </div>
      <span id="mode-label" class="mode-label">Loading</span>
    </header>

    <section class="toolbar">
      <label class="search-box">
        <span>Search</span>
        <input id="search-input" type="search" placeholder="ID or name">
      </label>
      <p id="count-label" class="muted">Loading index...</p>
    </section>

    <table class="model-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Dimensions</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody id="model-list">
        <tr><td colspan="4">Loading models...</td></tr>
      </tbody>
    </table>
  </main>
  <script type="module" src="/static/index.js"></script>
</body>
</html>
